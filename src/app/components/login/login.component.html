<div class="login-page">
  <div class="login-logo-container">
    <img class="login-logo-img" src="https://cdn.oreateai.com/aiimage/upload/c45bd4192455ca2d999939ba/d07d7bbf9d924f8d060264603175085f.png" alt="Logo Colegio Arenys de Mar">
    <h1 class="login-title">Colegio Arenys de Mar</h1>
    <p class="login-subtitle">Piedad y Letras · Quiz Interactivo</p>
  </div>

  <div class="login-card glass-card">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="label">Usuario</label>
      <input class="input" formControlName="username" id="username" autocomplete="username" />
      <div class="field-error" *ngIf="form.controls['username'].invalid && form.controls['username'].touched">Usuario requerido</div>

      <label class="label">Contraseña</label>
      <input class="input" formControlName="password" id="password" type="password" autocomplete="current-password" />
      <div class="field-error" *ngIf="form.controls['password'].invalid && form.controls['password'].touched">Contraseña requerida</div>

      <div class="actions">
        <button class="btn-primary" type="submit" [disabled]="loading">{{ loading ? 'Entrando...' : 'Ingresar' }}</button>
      </div>

      <div class="hint">Usuario: <strong>admin</strong> / Contraseña: <strong>admin123</strong></div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>
    </form>
  </div>
</div>
