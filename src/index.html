<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App — Colegio Arenys de Mar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════
           RESET & BASE
           ═══════════════════════════════════════════ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Fondo principal — Azul noche profundo */
            --bg-primary: #0F172A;
            /* Fondo secundario */
            --bg-secondary: #1E293B;
            /* Bordes suaves */
            --border-soft: #334155;
            /* Índigo neón */
            --accent-indigo: #6366F1;
            /* Púrpura vibrante */
            --accent-purple: #8B5CF6;
            /* Verde menta neón */
            --accent-green: #10B981;
            /* Dorado del escudo (logo) */
            --accent-gold: #D4A843;
            /* Azul marino del escudo (logo) */
            --accent-navy: #1B3A5C;
            /* Rojo para error */
            --accent-red: #EF4444;
            /* Texto principal */
            --text-primary: #F1F5F9;
            /* Texto secundario */
            --text-secondary: #94A3B8;
            /* Glow sombra */
            --glow-indigo: 0 0 20px rgba(99, 102, 241, 0.4);
            --glow-green: 0 0 20px rgba(16, 185, 129, 0.4);
            --glow-gold: 0 0 15px rgba(212, 168, 67, 0.35);
            --glow-purple: 0 0 20px rgba(139, 92, 246, 0.35);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ═══════════════════════════════════════════
           ANIMATED BACKGROUND PARTICLES
           ═══════════════════════════════════════════ */
        .bg-particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-particles .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: floatOrb 18s ease-in-out infinite alternate;
        }

        .bg-particles .orb:nth-child(1) {
            width: 400px; height: 400px;
            background: var(--accent-indigo);
            top: -10%; left: -5%;
            animation-duration: 20s;
        }

        .bg-particles .orb:nth-child(2) {
            width: 350px; height: 350px;
            background: var(--accent-purple);
            bottom: -10%; right: -5%;
            animation-duration: 24s;
            animation-delay: -5s;
        }

        .bg-particles .orb:nth-child(3) {
            width: 250px; height: 250px;
            background: var(--accent-gold);
            top: 40%; left: 50%;
            animation-duration: 16s;
            animation-delay: -8s;
            opacity: 0.10;
        }

        .bg-particles .orb:nth-child(4) {
            width: 200px; height: 200px;
            background: var(--accent-green);
            top: 70%; left: 15%;
            animation-duration: 22s;
            animation-delay: -3s;
            opacity: 0.12;
        }

        @keyframes floatOrb {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(40px, -30px) scale(1.05); }
            66%  { transform: translate(-20px, 20px) scale(0.95); }
            100% { transform: translate(30px, -15px) scale(1.02); }
        }

        /* ═══════════════════════════════════════════
           GLASS CARD UTILITY
           ═══════════════════════════════════════════ */
        .glass-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        /* ═══════════════════════════════════════════
           SCREEN CONTAINERS
           ═══════════════════════════════════════════ */
        .screen {
            display: none;
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .screen.active {
            display: flex;
        }

        /* ═══════════════════════════════════════════
           LOGIN SCREEN
           ═══════════════════════════════════════════ */
        #login-screen {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            gap: 32px;
        }

        .login-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .login-logo-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--accent-gold);
            box-shadow: var(--glow-gold);
            animation: logoPulse 3s ease-in-out infinite;
            object-fit: contain;
            background: #000;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: var(--glow-gold); transform: scale(1); }
            50%      { box-shadow: 0 0 30px rgba(212, 168, 67, 0.55); transform: scale(1.03); }
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-secondary);
            text-align: center;
            margin-top: -14px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .login-card label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .login-card input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid var(--border-soft);
            border-radius: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .login-card input[type="text"]::placeholder {
            color: #475569;
        }

        .login-card input[type="text"]:focus {
            border-color: var(--accent-indigo);
            box-shadow: var(--glow-indigo);
        }

        .input-error {
            border-color: var(--accent-red) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.35) !important;
        }

        .error-msg {
            font-size: 13px;
            color: var(--accent-red);
            display: none;
            margin-top: -14px;
        }

        .error-msg.visible {
            display: block;
        }

        /* ═══════════════════════════════════════════
           BUTTONS
           ═══════════════════════════════════════════ */
        .btn-primary {
            width: 100%;
            padding: 16px 24px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-primary:hover::before {
            opacity: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary span {
            position: relative;
            z-index: 1;
        }

        .btn-gold {
            width: 100%;
            padding: 16px 24px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #0F172A;
            background: linear-gradient(135deg, var(--accent-gold), #E8C46A);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-gold);
        }

        .btn-outline {
            width: 100%;
            padding: 16px 24px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            background: transparent;
            border: 1.5px solid var(--border-soft);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            border-color: var(--accent-indigo);
            box-shadow: var(--glow-indigo);
            color: #fff;
        }

        /* ═══════════════════════════════════════════
           QUIZ SCREEN
           ═══════════════════════════════════════════ */
        #quiz-screen {
            flex-direction: column;
            align-items: center;
            padding: 32px 24px;
            gap: 28px;
        }

        .quiz-header {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .quiz-greeting {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .quiz-greeting .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .quiz-greeting .greeting-text {
            font-size: 22px;
            font-weight: 600;
        }

        .quiz-greeting .greeting-text .name {
            background: linear-gradient(90deg, var(--accent-gold), #E8C46A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Progress bar */
        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-info .question-counter {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .progress-info .question-counter .current {
            color: var(--accent-indigo);
            font-weight: 700;
        }

        .progress-info .score-display {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .progress-bar-outer {
            width: 100%;
            height: 8px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--accent-indigo), var(--accent-purple));
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }

        .progress-bar-inner::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 30px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            filter: blur(4px);
        }

        /* Question card */
        .question-card {
            width: 100%;
            max-width: 640px;
            padding: 36px 32px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            animation: cardSlideIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes cardSlideIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .question-category {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-indigo);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (max-width: 520px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-card {
            padding: 18px 20px;
            border-radius: 14px;
            border: 1.5px solid var(--border-soft);
            background: rgba(15, 23, 42, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }

        .option-card .option-letter {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(51, 65, 85, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option-card:hover:not(.disabled) {
            border-color: var(--accent-indigo);
            background: rgba(99, 102, 241, 0.08);
            transform: translateY(-2px);
            box-shadow: var(--glow-indigo);
        }

        .option-card:hover:not(.disabled) .option-letter {
            background: var(--accent-indigo);
            color: #fff;
        }

        .option-card.selected {
            border-color: var(--accent-indigo);
            background: rgba(99, 102, 241, 0.12);
        }

        .option-card.selected .option-letter {
            background: var(--accent-indigo);
            color: #fff;
        }

        .option-card.correct {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.12);
            box-shadow: var(--glow-green);
        }

        .option-card.correct .option-letter {
            background: var(--accent-green);
            color: #fff;
        }

        .option-card.incorrect {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }

        .option-card.incorrect .option-letter {
            background: var(--accent-red);
            color: #fff;
        }

        .option-card.disabled {
            cursor: default;
            opacity: 0.6;
        }

        .option-card.correct.disabled,
        .option-card.incorrect.disabled {
            opacity: 1;
        }

        /* Feedback bar */
        .feedback-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 640px;
            padding: 16px 22px;
            border-radius: 14px;
            animation: feedbackIn 0.4s ease;
        }

        .feedback-bar.visible {
            display: flex;
        }

        .feedback-bar.correct-feedback {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .feedback-bar.incorrect-feedback {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .feedback-bar .feedback-text {
            font-size: 15px;
            font-weight: 600;
        }

        .feedback-bar .feedback-text.correct {
            color: var(--accent-green);
        }

        .feedback-bar .feedback-text.incorrect {
            color: var(--accent-red);
        }

        .feedback-bar .btn-next {
            padding: 10px 22px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .feedback-bar .btn-next:hover {
            transform: translateY(-1px);
            box-shadow: var(--glow-indigo);
        }

        @keyframes feedbackIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════════════════════════════════
           COMPLETION MODAL
           ═══════════════════════════════════════════ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal-overlay.visible {
            display: flex;
            animation: modalOverlayIn 0.3s ease;
        }

        @keyframes modalOverlayIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .modal-card {
            width: 100%;
            max-width: 440px;
            padding: 44px 36px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 22px;
            animation: modalCardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes modalCardIn {
            from { opacity: 0; transform: scale(0.85) translateY(40px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-trophy {
            font-size: 64px;
            animation: trophyBounce 0.6s ease;
        }

        @keyframes trophyBounce {
            0%   { transform: scale(0); }
            50%  { transform: scale(1.25); }
            70%  { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .modal-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), #E8C46A, var(--accent-indigo));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-message {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .modal-message .name-highlight {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .modal-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .modal-score .score-number {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), #34D399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-score .score-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        /* ═══════════════════════════════════════════
           CONFETTI CANVAS
           ═══════════════════════════════════════════ */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            z-index: 99;
            pointer-events: none;
        }

        /* ═══════════════════════════════════════════
           SCROLLBAR
           ═══════════════════════════════════════════ */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-soft);
            border-radius: 3px;
        }
    </style>
    </head>
    <body>
      <app-root></app-root>
    </body>
</html>
